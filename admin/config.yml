backend:
  name: github
  repo: rgjanet/libreta
  branch: main
site_url: https://rgjanet.github.io/libreta/
media_folder: assets/uploads
public_folder: assets/uploads
collections:
  - name: site
    label: Website
    files:
      - name: home
        label: Home page
        file: content/site.es.json
        format: json
        fields:
          - {label: Site name, name: site_title, widget: string}
          - {label: Tagline, name: tagline, widget: string, required: false}
          - {label: Search description, name: description, widget: text, required: false}
          - {label: Announcement strip (leave empty to hide), name: announcement, widget: string, required: false}
          - label: Sections
            name: sections
            widget: list
            hint: Add, remove and drag to reorder. Give a section a menu label to show it in the top menu.
            types:
              - label: Hero
                name: hero
                widget: object
                fields:
                  - {label: Headline, name: headline, widget: string}
                  - {label: Text, name: text, widget: text}
                  - {label: Button label, name: button_label, widget: string, required: false}
                  - {label: Button link, name: button_link, widget: string, required: false}
                  - {label: Image (replaces the shapes), name: image, widget: image, required: false}
                  - {label: Image description, name: image_alt, widget: string, required: false}
                  - {label: Menu label, name: nav_label, widget: string, required: false}
              - label: Service tiles
                name: services
                widget: object
                fields:
                  - {label: Heading, name: heading, widget: string, required: false}
                  - label: Tiles
                    name: tiles
                    widget: list
                    fields:
                      - {label: Title, name: title, widget: string}
                      - {label: Text, name: text, widget: text}
                      - {label: Colour, name: color, widget: select, default: pink, options: [pink, gold, aqua, red, olive, mint, paper]}
                      - {label: Icon, name: icon, widget: select, default: pen, options: [pen, page, code, book, none]}
                      - {label: Custom image (replaces icon), name: image, widget: image, required: false}
                  - {label: Menu label, name: nav_label, widget: string, required: false}
              - label: Latest work (video, audio, writing, pictures)
                name: works
                widget: object
                fields:
                  - {label: Heading, name: heading, widget: string}
                  - {label: Intro, name: intro, widget: text, required: false}
                  - {label: Kind of work, name: category, widget: select, default: video, options: [{label: Video, value: video}, {label: Audio and podcasts, value: audio}, {label: Writing, value: writing}, {label: Pictures, value: pictures}]}
                  - {label: How many to show, name: count, widget: number, default: 4, min: 1, max: 12}
                  - {label: Button text (links to that work page), name: button_label, widget: string, required: false}
                  - {label: Menu label, name: nav_label, widget: string, required: false}
              - label: Blog (latest posts)
                name: blog
                widget: object
                fields:
                  - {label: Heading, name: heading, widget: string}
                  - {label: Intro, name: intro, widget: text, required: false}
                  - {label: How many latest posts to show, name: count, widget: number, default: 3, min: 1, max: 12}
                  - {label: Menu label, name: nav_label, widget: string, required: false}
              - label: Work cards
                name: work
                widget: object
                fields:
                  - {label: Heading, name: heading, widget: string}
                  - {label: Intro, name: intro, widget: text, required: false}
                  - label: Projects
                    name: items
                    widget: list
                    fields:
                      - {label: Image, name: image, widget: image, required: false}
                      - {label: Image description, name: image_alt, widget: string, required: false}
                      - {label: Tag, name: tag, widget: string, required: false}
                      - {label: Title, name: title, widget: string}
                      - {label: Text, name: text, widget: text}
                      - {label: Link, name: link, widget: string, required: false}
                      - {label: Background colour, name: color, widget: select, default: aqua, options: [pink, gold, aqua, red, olive, mint, paper]}
                  - {label: Menu label, name: nav_label, widget: string, required: false}
              - label: About
                name: about
                widget: object
                fields:
                  - {label: Heading, name: heading, widget: string}
                  - {label: To-do list title (shown when there is no photo), name: list_title, widget: string, required: false}
                  - label: To-do list items
                    name: list
                    widget: list
                    required: false
                    fields:
                      - {label: Item, name: text, widget: string}
                      - {label: Done (ticked), name: done, widget: boolean, default: false}
                  - {label: Photo, name: image, widget: image, required: false}
                  - {label: Photo description, name: image_alt, widget: string, required: false}
                  - {label: Text, name: body, widget: markdown}
                  - {label: Menu label, name: nav_label, widget: string, required: false}
              - label: Feature (book, launch, offer)
                name: feature
                widget: object
                fields:
                  - {label: Heading, name: heading, widget: string}
                  - {label: Text, name: body, widget: markdown}
                  - {label: Image, name: image, widget: image, required: false}
                  - {label: Image description, name: image_alt, widget: string, required: false}
                  - {label: Button label, name: button_label, widget: string, required: false}
                  - {label: Button link, name: button_link, widget: string, required: false}
                  - {label: Background colour, name: color, widget: select, default: gold, options: [pink, gold, aqua, red, olive, mint, paper]}
                  - {label: Menu label, name: nav_label, widget: string, required: false}
              - label: Embed (video, podcast, Substack, map…)
                name: embed
                widget: object
                fields:
                  - {label: Heading, name: heading, widget: string, required: false}
                  - {label: Intro, name: intro, widget: text, required: false}
                  - {label: Embed code (paste the iframe), name: code, widget: text}
                  - {label: Caption, name: caption, widget: string, required: false}
                  - {label: Menu label, name: nav_label, widget: string, required: false}
              - label: Image gallery
                name: gallery
                widget: object
                fields:
                  - {label: Heading, name: heading, widget: string, required: false}
                  - label: Images
                    name: images
                    widget: list
                    fields:
                      - {label: Image, name: image, widget: image}
                      - {label: Image description, name: alt, widget: string, required: false}
                      - {label: Caption, name: caption, widget: string, required: false}
                  - {label: Menu label, name: nav_label, widget: string, required: false}
              - label: Text block
                name: text
                widget: object
                fields:
                  - {label: Heading, name: heading, widget: string}
                  - {label: Text, name: body, widget: markdown}
                  - {label: Menu label, name: nav_label, widget: string, required: false}
          - {label: Blog - "All posts" button, name: blog_all, widget: string}
          - {label: Blog - "Back to blog" link, name: blog_back, widget: string}
          - {label: Blog - "min read" label, name: blog_read, widget: string}
          - {label: Blog - label above the audio player, name: blog_listen, widget: string, required: false}
          - {label: Blog - "Newer" post label, name: blog_newer, widget: string}
          - {label: Blog - "Older" post label, name: blog_older, widget: string}
          - {label: Blog - message when a post is missing in this language, name: blog_missing, widget: string}
          - label: Work pages (menu names and page headings)
            name: categories
            widget: list
            label_singular: page
            summary: "{{fields.label}}"
            hint: One page for each kind of work. Remove one to hide it from the menu.
            fields:
              - {label: Kind of work, name: id, widget: select, options: [{label: Video, value: video}, {label: Audio and podcasts, value: audio}, {label: Writing, value: writing}, {label: Pictures, value: pictures}]}
              - {label: Menu name, name: label, widget: string}
              - {label: Page heading, name: heading, widget: string}
              - {label: Intro, name: intro, widget: text, required: false}
          - {label: Label - back to home, name: home_label, widget: string}
          - {label: Message when a work page is empty, name: empty_label, widget: string}
          - {label: Footer heading, name: footer_heading, widget: string}
          - label: Footer links
            name: footer_links
            widget: list
            fields:
              - {label: Label, name: label, widget: string}
              - {label: URL (use mailto:you@email.com for email), name: url, widget: string}
              - {label: Icon (Auto picks it from the URL), name: icon, widget: select, default: auto, options: [{label: Auto, value: auto}, {label: Instagram, value: instagram}, {label: YouTube, value: youtube}, {label: LinkedIn, value: linkedin}, {label: X / Twitter, value: x}, {label: Substack, value: substack}, {label: TikTok, value: tiktok}, {label: Spotify, value: spotify}, {label: Email, value: email}, {label: Generic link, value: link}, {label: No icon (show the name as text), value: none}]}
          - {label: Legal line, name: legal, widget: string}
  - name: blog
    label: Blog
    label_singular: Post
    folder: content/blog
    create: true
    format: json
    extension: json
    fields:
      - {label: Title, name: title, widget: string}
      - {label: Date, name: date, widget: datetime}
      - {label: Tag, name: tag, widget: string, required: false}
      - {label: Cover image, name: cover, widget: image, required: false}
      - {label: Cover image description, name: cover_alt, widget: string, required: false}
      - {label: "Video: upload an MP4 (ideally under 25 MB)", name: video_file, widget: file, required: false, choose_url: false}
      - {label: "Video: or paste a link (YouTube, Vimeo, Archive.org or a direct .mp4)", name: video_url, widget: string, required: false}
      - {label: Video caption, name: video_caption, widget: string, required: false}
      - {label: Video position, name: video_position, widget: select, default: before, options: [{label: Before the text, value: before}, {label: After the text, value: after}]}
      - {label: "Audio: upload an MP3 (ideally under 25 MB)", name: audio_file, widget: file, required: false, choose_url: false}
      - {label: "Audio: or paste a link (direct .mp3 or an Archive.org page)", name: audio_url, widget: string, required: false}
      - {label: "Audio: or paste a player code (Spotify, Apple Podcasts, SoundCloud)", name: audio_embed, widget: text, required: false}
      - {label: Audio caption, name: audio_caption, widget: string, required: false}
      - {label: Audio position, name: audio_position, widget: select, default: before, options: [{label: Before the text, value: before}, {label: After the text, value: after}]}
      - {label: Card colour (when no cover), name: color, widget: select, default: pink, options: [pink, gold, aqua, red, olive, mint, paper]}
      - {label: Short summary, name: excerpt, widget: text}
      - {label: Post, name: body, widget: markdown}
  - name: work
    label: Work
    label_singular: Work
    folder: content/work
    create: true
    format: json
    extension: json
    fields:
      - {label: Title, name: title, widget: string}
      - {label: Kind of work, name: category, widget: select, options: [{label: Video, value: video}, {label: Audio and podcasts, value: audio}, {label: Writing, value: writing}, {label: Pictures, value: pictures}]}
      - {label: Date, name: date, widget: datetime}
      - {label: Cover image, name: cover, widget: image, required: false}
      - {label: Cover image description, name: cover_alt, widget: string, required: false}
      - {label: Short summary, name: summary, widget: text, required: false}
      - {label: "VIDEO: upload an MP4 (ideally under 25 MB)", name: video_file, widget: file, required: false, choose_url: false}
      - {label: "VIDEO: or paste a link (YouTube, Vimeo, Archive.org or a direct .mp4)", name: video_url, widget: string, required: false}
      - {label: "AUDIO: paste the player code (Spotify, Apple Podcasts, SoundCloud)", name: embed, widget: text, required: false}
      - {label: "AUDIO: or upload an MP3", name: audio_file, widget: file, required: false, choose_url: false}
      - label: "PICTURES: images"
        name: images
        widget: list
        required: false
        label_singular: image
        fields:
          - {label: Image, name: image, widget: image}
          - {label: Image description, name: alt, widget: string, required: false}
          - {label: Caption, name: caption, widget: string, required: false}
      - {label: "WRITING: link to the published piece", name: link, widget: string, required: false}
      - {label: "WRITING: or the full text (opens on its own page)", name: body, widget: markdown, required: false}
      - {label: Credit label (e.g. Presented by), name: credit_label, widget: string, required: false}
      - {label: "Credit name (client, publication, show)", name: credit_name, widget: string, required: false}
      - {label: Credit link, name: credit_link, widget: string, required: false}
      - label: More links
        name: links
        widget: list
        required: false
        fields:
          - {label: Label, name: label, widget: string}
          - {label: URL, name: url, widget: string}
      - {label: Card colour (when no cover), name: color, widget: select, default: aqua, options: [pink, gold, aqua, red, olive, mint, paper]}
