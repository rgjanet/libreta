<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Janet Rodríguez</title>
<meta name="description" content="">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,700;0,9..144,900;1,9..144,500&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&family=Caveat:wght@700&display=swap" rel="stylesheet">
<style>
:root{--ink:#333;--paper:#FCF3EA;--pink:#FFBBA6;--gold:#FBB94B;--aqua:#A4CCC4;--red:#EE583F;--olive:#97AA6A;--mint:#D9E9D9}
html{scroll-behavior:smooth;scroll-padding-top:12px}*,*:before,*:after{box-sizing:border-box}
body{margin:0;background:#fff radial-gradient(circle,rgba(51,51,51,.4) 1.1px,transparent 1.6px) 12px 12px/24px 24px;color:var(--ink);font:17px/1.6 'Source Serif 4',Georgia,serif}
h1,h2,h3{font-family:Fraunces,Georgia,serif;margin:0;line-height:1}a{color:inherit}
:focus-visible{outline:3px solid var(--red);outline-offset:3px}
.wrap{max-width:1060px;margin:0 auto;padding:0 22px}.mono{font:500 13px 'IBM Plex Mono',monospace}
.strip{background:var(--pink);text-align:center;padding:7px 12px}
header .wrap{display:flex;justify-content:space-between;align-items:center;gap:16px;padding-top:20px;padding-bottom:20px}
header b{font:900 26px Fraunces,serif}header nav,.lang{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
header nav a{text-decoration:none;border-bottom:2px solid transparent}header nav a:hover{border-color:var(--red)}
.lang button{font:inherit;background:none;border:2px solid var(--ink);border-radius:99px;padding:3px 11px;cursor:pointer;color:var(--ink)}
.lang button[aria-pressed=true]{background:var(--ink);color:var(--paper)}
.btn{display:inline-block;background:var(--mint);color:var(--ink);border:2px solid var(--ink);border-radius:99px;padding:12px 24px;text-decoration:none;font:600 14px 'IBM Plex Mono',monospace;cursor:pointer}
.btn:hover{background:var(--gold)}.btn.red{background:var(--red);color:var(--paper)}
.block{padding:72px 0 0}.block>.wrap>h2,.head2 h2{font-size:clamp(30px,4.6vw,48px);font-weight:900;letter-spacing:-.02em;margin-bottom:14px}
.intro{max-width:56ch;margin:0 0 24px}
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:20px;align-items:center;padding-top:36px}
.hero h1{font-size:clamp(42px,7.6vw,92px);font-weight:900;letter-spacing:-.03em}.hero p{max-width:40ch;font-size:19px;margin:20px 0 26px}
.shapes{position:relative;height:280px}.shapes>*{position:absolute}
.hero img,.feat img,.about img{width:100%;height:auto;border:2px solid var(--ink);display:block}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));border:2px solid var(--ink)}
.tile{padding:22px 18px 24px;min-height:290px;display:flex;flex-direction:column;border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);margin:0 -2px -2px 0}
.tile h3{font-size:42px;font-weight:900}.tile p{font-size:15px;line-height:1.45;margin:10px 0 auto}.tile svg,.tile img{width:76px;height:76px;margin-top:14px}
.work{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:24px}
.card{background:var(--paper);border:2px solid var(--ink);display:flex;flex-direction:column;text-decoration:none}
.card .img{height:180px;border-bottom:2px solid var(--ink);overflow:hidden}.card .img img{width:100%;height:100%;object-fit:cover;display:block}
.card .body{padding:16px 18px 20px}.card h3{font-size:24px;margin:8px 0 6px}.card p{margin:0;font-size:15px;line-height:1.5}
.tag{display:inline-block;background:var(--gold);padding:2px 10px;border-radius:99px;border:1.5px solid var(--ink)}
.about{display:grid;grid-template-columns:1fr 1.4fr;gap:44px;align-items:center}
.sheet{background:var(--aqua);border:2px solid var(--ink);padding:30px 26px;transform:rotate(-2deg);position:relative;font:700 30px/1.15 Caveat,cursive}
.feat{display:grid;grid-template-columns:220px 1fr;gap:34px;align-items:center;border:2px solid var(--ink);padding:34px}
.feat.nopic{grid-template-columns:1fr}.feat h2{font-size:clamp(28px,4vw,42px);font-weight:900;margin-bottom:12px}
.embed{max-width:100%;overflow:auto}.embed iframe{max-width:100%;border:2px solid var(--ink);background:#fff}
.cap{font-size:14px;margin-top:8px}
.gal{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px}.gal figure{margin:0}.gal img{width:100%;border:2px solid var(--ink);display:block}
.prose{max-width:62ch}
.contact{display:grid;grid-template-columns:1fr 1.1fr;gap:40px}.contact h2{font-size:clamp(34px,5vw,56px);font-weight:900;margin-bottom:14px}
form{display:grid;gap:14px}label{display:grid;gap:5px}
input,textarea,select{font:inherit;background:var(--paper);border:2px solid var(--ink);border-radius:6px;padding:11px 12px;color:var(--ink)}textarea{min-height:110px}
.pen{margin-top:80px;background:var(--olive);padding:34px 0}.pen .wrap{display:flex;flex-wrap:wrap;gap:20px 40px;justify-content:space-between;align-items:center}
.pen h2{font-size:34px;font-weight:900}.pen nav{display:flex;gap:22px;flex-wrap:wrap}.legal{padding:16px 0;text-align:center;background:var(--ink);color:var(--paper)}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:22px}
.vt{all:unset;cursor:pointer;display:block;align-self:start;color:var(--ink)}.vt[disabled]{cursor:default}
.vt .th{position:relative;display:block;aspect-ratio:9/16;border:2px solid var(--ink);overflow:hidden}
.vt .th img,.vt .th video{width:100%;height:100%;object-fit:cover;display:block}
.vt .play{position:absolute;left:12px;bottom:12px;width:46px;height:46px;border-radius:50%;background:var(--red);border:2px solid var(--ink);display:grid;place-items:center}
.vt .play:after{content:"";margin-left:4px;border-left:14px solid var(--paper);border-top:8px solid transparent;border-bottom:8px solid transparent}
.vt[disabled] .play{display:none}.vt b{display:block;font:700 18px/1.2 Fraunces,serif;margin-top:10px;min-height:2.4em}.vt:focus-visible .th{outline:3px solid var(--red);outline-offset:3px}
dialog.lb{border:0;padding:0;background:transparent;max-width:100vw;max-height:100vh;overflow:auto;color:#fff}dialog.lb::backdrop{background:rgba(20,20,20,.92)}
.lb-in{display:flex;flex-direction:column;align-items:center;gap:12px;padding:48px 16px 20px}
.lb-x{position:fixed;top:8px;right:14px;background:none;border:0;color:#fff;font:400 40px/1 sans-serif;cursor:pointer;padding:4px 10px}
.lb-m{height:min(72vh,calc((100vw - 32px)*16/9));aspect-ratio:9/16;border-radius:8px;overflow:hidden}
.lb-m video,.lb-m iframe{width:100%;height:100%;border:0;display:block;object-fit:cover}
.lb-t{font:700 18px 'Source Serif 4',serif;text-align:center;max-width:42ch}.lb-l{font-size:15px;text-align:center}.lb-l a{color:var(--gold)}
.back{text-decoration:none;border-bottom:2px solid var(--red)}.post h1{font-size:clamp(34px,6vw,64px);font-weight:900;letter-spacing:-.02em;margin:14px 0 22px;max-width:20ch}
.post>img{width:100%;max-width:760px;border:2px solid var(--ink);display:block;margin:0 0 26px}.prose img{max-width:100%;border:2px solid var(--ink)}.prose iframe{max-width:100%}
.sheet:before{content:"";position:absolute;top:-14px;left:36px;width:110px;height:28px;background:rgba(255,187,166,.9);transform:rotate(-5deg)}
.sheet h3{font:700 32px/1 Caveat,cursive;margin-bottom:14px}.chk{list-style:none;margin:0;padding:0;font:700 25px/1.25 Caveat,cursive}.chk li{display:flex;gap:12px;align-items:center;padding:5px 0}
.chk i{flex:none;position:relative;width:22px;height:22px;border:2.5px solid var(--ink);border-radius:4px;background:var(--paper)}
.chk .on i:after{content:"";position:absolute;left:5px;top:-4px;width:7px;height:14px;border:solid var(--red);border-width:0 4px 4px 0;transform:rotate(40deg)}
.chk .on span{text-decoration:line-through;text-decoration-thickness:2px;text-decoration-color:var(--red)}
.wrap.post{max-width:860px}.post .meta{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-top:22px}.post .lede{font-size:21px;line-height:1.5;max-width:52ch;margin:0 0 28px}
.prose p{margin:0 0 1.1em}.prose h2{font:900 clamp(26px,4vw,34px)/1.1 Fraunces,serif;margin:40px 0 14px}.prose h3{font:700 24px/1.15 Fraunces,serif;margin:30px 0 10px}
.prose blockquote{margin:30px 0;padding:4px 0 4px 22px;border-left:6px solid var(--red);font:italic 500 clamp(21px,3vw,26px)/1.35 Fraunces,serif}.prose blockquote p{margin:0}
.prose a{color:var(--red)}.prose ul,.prose ol{padding-left:1.3em;margin:0 0 1.1em}.prose li{margin:4px 0}.prose hr{border:0;border-top:3px dotted var(--ink);margin:38px 0}.prose img{display:block;margin:28px 0}
.prose code{background:var(--mint);padding:1px 6px;border-radius:4px;font:14px 'IBM Plex Mono',monospace}
.pn{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:60px}.pn .card{padding:16px 18px;color:var(--ink)}.pn .card:last-child{text-align:right}.pn b{display:block;font:700 20px/1.2 Fraunces,serif;margin-top:6px}
@media(max-width:780px){.pn{grid-template-columns:1fr}.pn .card:last-child{text-align:left}}
.c-pink{background:var(--pink)}.c-gold{background:var(--gold)}.c-aqua{background:var(--aqua)}.c-red{background:var(--red);color:var(--paper)}.c-olive{background:var(--olive)}.c-mint{background:var(--mint)}.c-paper{background:var(--paper)}
@media(max-width:780px){.hero,.about,.contact,.feat{grid-template-columns:1fr}.shapes{height:150px}header nav{display:none}.feat{padding:22px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>
<body>
<div id="app" aria-live="polite"></div>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script>
const E=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const U=p=>!p?'':/^(https?:|mailto:|#)/.test(p)?p:p.replace(/^\//,'');
const MD=t=>window.marked?marked.parse(t||''):'<p>'+E(t)+'</p>';
const slug=t=>String(t).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const COL=c=>'c-'+(c||'paper');
const ICON={
 pen:'<path d="M12 64 L18 44 L52 10 L66 24 L32 58Z" fill="#FCF3EA" stroke="#333" stroke-width="3"/>',
 page:'<rect x="14" y="10" width="48" height="58" fill="#FCF3EA" stroke="#333" stroke-width="3"/><path d="M24 28H52M24 40H52M24 52H42" stroke="#EE583F" stroke-width="4"/>',
 code:'<rect x="8" y="14" width="60" height="46" rx="4" fill="#FCF3EA" stroke="#333" stroke-width="3"/><path d="M30 28L20 37L30 46M46 28L56 37L46 46" fill="none" stroke="#EE583F" stroke-width="4"/>',
 book:'<path d="M8 18H36V64H8ZM68 18H40V64H68Z" fill="#FBB94B" stroke="#333" stroke-width="3"/>'};
const btn=(l,u,c)=>l?`<a class="btn ${c||''}" href="${E(U(u)||'#')}">${E(l)}</a>`:'';
const img=(s,a)=>s?`<img src="${E(U(s))}" alt="${E(a||'')}" loading="lazy">`:'';
let CUR={};const getQ=()=>new URLSearchParams(location.search);
const fd=x=>{const t=new Date(x);return isNaN(t)?'':t.toLocaleDateString(lang,{year:'numeric',month:'long',day:'numeric'})};
const sorted=d=>(d.posts||[]).slice().sort((a,b)=>new Date(b.date)-new Date(a.date));
const PS=p=>p.slug||slug(p.title);
const PL=p=>`<a class="card" href="?post=${encodeURIComponent(PS(p))}"><div class="img ${COL(p.color)}">${p.cover?img(p.cover,p.cover_alt):''}</div><div class="body">${p.tag?`<span class="tag mono">${E(p.tag)}</span> `:''}<span class="mono">${fd(p.date)}</span><h3>${E(p.title)}</h3><p>${E(p.excerpt)}</p></div></a>`;
function view(d,Q){const back=`<a class="mono back" href="./#blog">← ${E(d.blog_back)}</a>`,k=Q.get('post');
 if(k){const p=sorted(d).find(x=>PS(x)===k);
  if(!p)return `<section class="block"><div class="wrap">${back}<h2 style="margin-top:20px">${E(d.blog_missing)}</h2></div></section>`;
  document.title=p.title+' — '+d.site_title;
  const S2=sorted(d),i=S2.indexOf(p),nw=S2[i-1],od=S2[i+1],mins=Math.max(1,Math.round(String(p.body||'').split(/\s+/).length/200));
  const pc=(x,l)=>`<a class="card pc" href="?post=${encodeURIComponent(PS(x))}"><span class="mono">${l}</span><b>${E(x.title)}</b></a>`;
  return `<section class="block"><div class="wrap post">${back}<div class="meta mono">${p.tag?`<span class="tag">${E(p.tag)}</span>`:''}<span>${fd(p.date)}</span><span>· ${mins} ${E(d.blog_read)}</span></div><h1>${E(p.title)}</h1>${p.excerpt?`<p class="lede">${E(p.excerpt)}</p>`:''}${p.cover?img(p.cover,p.cover_alt):''}<div class="prose">${MD(p.body)}</div><nav class="pn" aria-label="Posts">${nw?pc(nw,'← '+E(d.blog_newer)):'<span></span>'}${od?pc(od,E(d.blog_older)+' →'):'<span></span>'}</nav></div></section>`}
 return `<section class="block"><div class="wrap">${back}<h2 style="margin:20px 0 24px;font-size:clamp(30px,4.6vw,48px);font-weight:900">${E(d.blog_all)}</h2><div class="work">${sorted(d).map(PL).join('')}</div></div></section>`}
let VIDS=[];
const ytId=u=>{const m=String(u||'').match(/(?:youtu\.be\/|shorts\/|v=|embed\/)([\w-]{11})/);return m?m[1]:''};
const R={
 hero:s=>`<div class="wrap hero"><div><h1>${E(s.headline)}</h1><p>${E(s.text)}</p>${btn(s.button_label,s.button_link)}</div>${s.image?`<div>${img(s.image,s.image_alt)}</div>`:`<div class="shapes" aria-hidden="true"><i style="right:0;top:0;width:110px;height:230px;background:var(--olive);border-radius:230px 0 0 230px"></i><i style="left:8%;top:14px;width:160px;height:160px;background:var(--gold);border-radius:50%"></i><svg style="left:0;bottom:0" width="250" height="120" viewBox="0 0 250 120"><path d="M8 90 C 40 10, 70 10, 90 60 S 150 110, 180 40 S 225 30, 240 70" fill="none" stroke="#EE583F" stroke-width="16" stroke-linecap="round"/></svg></div>`}</div>`,
 services:s=>`<div class="wrap">${s.heading?`<h2>${E(s.heading)}</h2>`:''}<div class="tiles">${(s.tiles||[]).map(t=>`<div class="tile ${COL(t.color)}"><h3>${E(t.title)}</h3><p>${E(t.text)}</p>${t.image?img(t.image,''):ICON[t.icon]?`<svg viewBox="0 0 76 76" aria-hidden="true">${ICON[t.icon]}</svg>`:''}</div>`).join('')}</div></div>`,
 work:s=>`<div class="wrap"><h2>${E(s.heading)}</h2>${s.intro?`<p class="intro">${E(s.intro)}</p>`:''}<div class="work">${(s.items||[]).map(i=>{const T=i.link?'a':'article';return `<${T} class="card" ${i.link?`href="${E(U(i.link))}"`:''}><div class="img ${COL(i.color)}">${img(i.image,i.image_alt)}</div><div class="body">${i.tag?`<span class="tag mono">${E(i.tag)}</span>`:''}<h3>${E(i.title)}</h3><p>${E(i.text)}</p></div></${T}>`}).join('')}</div></div>`,
 about:s=>`<div class="wrap about"><div>${s.image?img(s.image,s.image_alt):`${s.list&&s.list.length?`<div class="sheet"><h3>${E(s.list_title)}</h3><ul class="chk">${s.list.map(x=>`<li class="${x.done?'on':''}"><i></i><span>${E(x.text)}</span></li>`).join('')}</ul></div>`:`<div class="sheet">${E(s.note)}</div>`}`}</div><div><h2>${E(s.heading)}</h2><div class="prose">${MD(s.body)}</div></div></div>`,
 feature:s=>`<div class="wrap"><div class="feat ${COL(s.color)} ${s.image?'':'nopic'}">${s.image?`<div>${img(s.image,s.image_alt)}</div>`:''}<div><h2>${E(s.heading)}</h2><div class="prose">${MD(s.body)}</div>${btn(s.button_label,s.button_link,'red')}</div></div></div>`,
 embed:s=>`<div class="wrap">${s.heading?`<h2>${E(s.heading)}</h2>`:''}${s.intro?`<p class="intro">${E(s.intro)}</p>`:''}<div class="embed">${s.code||''}</div>${s.caption?`<p class="cap">${E(s.caption)}</p>`:''}</div>`,
 gallery:s=>`<div class="wrap">${s.heading?`<h2>${E(s.heading)}</h2>`:''}<div class="gal">${(s.images||[]).map(i=>`<figure>${img(i.image,i.alt)}${i.caption?`<figcaption class="cap">${E(i.caption)}</figcaption>`:''}</figure>`).join('')}</div></div>`,
 text:s=>`<div class="wrap"><h2>${E(s.heading)}</h2><div class="prose">${MD(s.body)}</div></div>`,
blog:s=>{const P=sorted(CUR),n=+s.count||3;return `<div class="wrap"><h2>${E(s.heading)}</h2>${s.intro?`<p class="intro">${E(s.intro)}</p>`:''}<div class="work">${P.slice(0,n).map(PL).join('')}</div>${P.length>n?`<p style="margin-top:26px"><a class="btn" href="?posts=all">${E(CUR.blog_all)}</a></p>`:''}</div>`},
 videos:s=>`<div class="wrap">${s.heading?`<h2>${E(s.heading)}</h2>`:''}${s.intro?`<p class="intro">${E(s.intro)}</p>`:''}<div class="vgrid">${(s.items||[]).map(v=>{const y=ytId(v.url),ok=v.file||y||/vimeo\.com\/\d+/.test(v.url||''),k=VIDS.push(v)-1,t=v.poster?img(v.poster,''):v.file?`<video src="${E(U(v.file))}#t=0.1" preload="metadata" muted playsinline></video>`:y?`<img src="https://img.youtube.com/vi/${y}/hqdefault.jpg" alt="" loading="lazy">`:'';return `<button class="vt" ${ok?`data-v="${k}"`:'disabled'}><span class="th ${COL(v.color)}">${t}<span class="play"></span></span><b>${E(v.title)}</b></button>`}).join('')}</div></div>`,
};
const LANGS=['es']; // add 'en' here to bring back the EN/ES toggle
let lang=LANGS[0];try{lang=new URLSearchParams(location.search).get('lang')||localStorage.getItem('lang')||(navigator.language||'en').slice(0,2)}catch(e){}
if(!LANGS.includes(lang))lang=LANGS[0];
function openV(v,dlg,lm,b){
 const y=ytId(v.url),vm=String(v.url||'').match(/vimeo\.com\/(\d+)/);
 if(v.file){lm.innerHTML=`<video src="${E(U(v.file))}" ${v.poster?`poster="${E(U(v.poster))}"`:''} controls autoplay playsinline></video>`;const el=lm.firstChild;el.onloadedmetadata=()=>{if(el.videoWidth)lm.style.aspectRatio=el.videoWidth+'/'+el.videoHeight}}
 else if(y)lm.innerHTML=`<iframe src="https://www.youtube.com/embed/${y}?autoplay=1&playsinline=1&rel=0" title="${E(v.title)}" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>`;
 else if(vm)lm.innerHTML=`<iframe src="https://player.vimeo.com/video/${vm[1]}?autoplay=1" title="${E(v.title)}" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>`;
 else return;
 dlg.querySelector('.lb-t').textContent=v.title||'';
 const L=[];if(v.credit_name)L.push(`${E(v.credit_label)} ${v.credit_link?`<a href="${E(U(v.credit_link))}" target="_blank" rel="noopener">${E(v.credit_name)}</a>`:E(v.credit_name)}`);
 (v.links||[]).forEach(x=>L.push(`<a href="${E(U(x.url))}" target="_blank" rel="noopener">${E(x.label)}</a>`));
 dlg.querySelector('.lb-l').innerHTML=L.map(x=>`<div>${x}</div>`).join('');dlg._b=b;dlg.showModal();
}
async function load(l){const r=await fetch(`content/site.${l}.json`);if(!r.ok)throw 0;return r.json()}
async function draw(l){
 let d;try{d=await load(l)}catch(e){try{d=await load(LANGS[0]);l=LANGS[0]}catch(e2){document.getElementById('app').textContent='Content not found.';return}}
 lang=l;try{localStorage.setItem('lang',l)}catch(e){}
 document.documentElement.lang=l;document.title=d.site_title+(d.tagline?' — '+d.tagline:'');
 document.querySelector('meta[name=description]').content=d.description||'';
 VIDS=[];CUR=d;const S=d.sections||[];let nav='';
 let body=S.map((s,i)=>{const f=R[s.type];if(!f)return'';const id=slug(s.nav_label||'')||'s'+i;if(s.nav_label)nav+=`<a href="./#${id}">${E(s.nav_label)}</a>`;return `<section class="block" id="${id}">${f(s)}</section>`}).join('');
 const Q=getQ();if(Q.get('post')!==null||Q.get('posts')!==null)body=view(d,Q);
